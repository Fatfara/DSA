                if (midNode) {
                    midNode.className = "w-12 h-14 rounded-xl bg-blue-600 border border-blue-400 flex flex-col items-center justify-center font-mono text-xs text-white font-bold scale-105 shadow-lg shadow-blue-500/50";
                }
                status.innerText = `Left: ${l}, Right: ${r} -> Mid Index: ${mid} (Value: ${[5, 12, 18, 25, 34, 42, 55, 68, 80, 95][mid]})`;
                await new Promise(r => setTimeout(r, 900));

                let val = [5, 12, 18, 25, 34, 42, 55, 68, 80, 95][mid];
                if (val === target) {
                    midNode.className = "w-12 h-14 rounded-xl bg-emerald-600 border border-emerald-400 flex flex-col items-center justify-center font-mono text-xs text-white font-bold scale-110 shadow-lg shadow-emerald-500/50";
                    status.innerText = `Success! Target 42 found at index ${mid} in O(log n) steps! 🎉`;
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
                    return;
                } else if (val < target) {
                    l = mid + 1;
                } else {
                    r = mid - 1;
                }
            }
        }

        function resetBinarySearchAnim() {
            for (let i = 0; i <= 9; i++) {
                const node = document.getElementById(`bnode-${i}`);
                if (node) {
                    node.className = "w-12 h-14 rounded-xl bg-slate-800 border border-slate-700 flex flex-col items-center justify-center font-mono text-xs text-slate-200 transition-all duration-300";
                }
            }
            document.getElementById('bin-search-status').innerText = "Reset binary search visualizer.";
        }

        async function runBubbleSortAnim() {
            let arr = [65, 20, 85, 35, 50, 15];
            const status = document.getElementById('bubble-status');
            
            for (let i = 0; i < arr.length - 1; i++) {
                for (let j = 0; j < arr.length - i - 1; j++) {
                    // Highlight comparing bars
                    const bar1 = document.getElementById(`bbar-${j}`);
                    const bar2 = document.getElementById(`bbar-${j+1}`);
                    if (bar1 && bar2) {
                        bar1.classList.add('bg-amber-500');
                        bar2.classList.add('bg-amber-500');
                    }
                    status.innerText = `Comparing arr[${j}] (${arr[j]}) and arr[${j+1}] (${arr[j+1]})`;
                    await new Promise(r => setTimeout(r, 500));

                    if (arr[j] > arr[j+1]) {
                        // Swap
                        let temp = arr[j];
                        arr[j] = arr[j+1];
                        arr[j+1] = temp;
                        
                        if (bar1 && bar2) {
                            bar1.style.height = `${arr[j] * 1.1}px`;
                            bar1.innerText = arr[j];
                            bar2.style.height = `${arr[j+1] * 1.1}px`;
                            bar2.innerText = arr[j+1];
                        }
                        status.innerText = `Swapped! Larger element bubbled right.`;
                        await new Promise(r => setTimeout(r, 500));
                    }
                    if (bar1 && bar2) {
                        bar1.classList.remove('bg-amber-500');
                        bar2.classList.remove('bg-amber-500');
                    }
                }
                const sortedBar = document.getElementById(`bbar-${arr.length - 1 - i}`);
                if (sortedBar) sortedBar.classList.add('bg-emerald-500');
            }
            const firstBar = document.getElementById(`bbar-0`);
            if (firstBar) firstBar.classList.add('bg-emerald-500');
            status.innerText = `Bubble Sort Complete! Array is fully sorted in O(n²) time. 🎉`;
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
        }

        function resetBubbleSortAnim() {
            let arr = [65, 20, 85, 35, 50, 15];
            for (let i = 0; i < arr.length; i++) {
                const bar = document.getElementById(`bbar-${i}`);
                if (bar) {
                    bar.style.height = `${arr[i] * 1.1}px`;
                    bar.innerText = arr[i];
                    bar.className = "w-12 bg-gradient-to-t from-blue-600 to-cyan-400 rounded-t-lg flex items-start justify-center pt-2 text-[11px] font-mono font-bold text-white transition-all duration-300 shadow-md";
                }
            }
            document.getElementById('bubble-status').innerText = "Reset bubble sort visualizer.";
        }

        async function runMergeSortAnim() {
            const resBox = document.getElementById('merge-result-box');
            resBox.innerHTML = `<span class="text-amber-300 animate-pulse">Running Merge Recursion...</span>`;
            await new Promise(r => setTimeout(r, 800));
            resBox.innerHTML = [3, 9, 10, 27, 38, 43, 82].map(v => `<span class="px-1.5 py-0.5 bg-emerald-950/80 border border-emerald-500/40 rounded">${v}</span>`).join('');
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
        }

        // Modals
        function openModal(title, contentHtml) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-body').innerHTML = contentHtml;
            document.getElementById('modal-backdrop').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        function triggerQuizModal() {
            const slide = slides[currentSlideIndex];
            if (!slide.quiz) {
                openModal('Quiz', `<p class="text-xs text-slate-300">No quiz available for this slide.</p>`);
                return;
            }
            const q = slide.quiz;
            let html = `
                <div class="space-y-4">
                    <h4 class="text-sm font-bold text-white">${q.question}</h4>
                    <div class="space-y-2">
                        ${q.options.map((opt, i) => `
                            <button onclick="checkQuizAnswer(${i}, ${q.answer})" class="w-full text-left p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs font-medium transition border border-slate-700 flex items-center justify-between">
                                <span>${opt}</span>
                                <span class="w-5 h-5 rounded-full border border-slate-600 flex items-center justify-center text-[10px] font-mono">${String.fromCharCode(65 + i)}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div id="quiz-result" class="text-xs font-semibold"></div>
                </div>
            `;
            openModal('Topic Knowledge Check', html);
        }

        function checkQuizAnswer(selected, correct) {
            const res = document.getElementById('quiz-result');
            if (selected === correct) {
                res.innerHTML = `<span class="text-emerald-400">Correct! +50 XP Earned 🎉</span>`;
                userXP += 50;
                document.getElementById('header-xp').innerText = userXP;
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            } else {
                res.innerHTML = `<span class="text-red-400">Incorrect. Review the masterclass notes and try again!</span>`;
            }
        }

        function runCodeSnippet() {
            openModal('Java Compiler Execution Output', `
                <div class="space-y-3 font-mono text-xs">
                    <div class="text-emerald-400 flex items-center space-x-2">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        <span>javac Main.java && java Main (Executed in 0.12s)</span>
                    </div>
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-slate-300 space-y-1">
                        <p>> Initializing JVM Heap allocation...</p>
                        <p>> Executing algorithm simulation and pointer trace...</p>
                        <p class="text-emerald-400 font-bold">> Program exited with code 0 (Success) 🚀</p>
                    </div>
                </div>
            `);
        }

        function triggerDryRun() {
            openModal('Step-by-Step Dry Run Trace', `
                <div class="space-y-3 text-xs">
                    <p class="text-slate-300">Tracing algorithm pointers and index variables across loop cycles:</p>
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono space-y-2">
                        <div class="flex justify-between text-slate-400 border-b border-slate-800 pb-1">
                            <span>Iteration</span><span>Pointer Left</span><span>Pointer Right</span><span>Status</span>
                        </div>
                        <div class="flex justify-between text-blue-400"><span>1</span><span>0</span><span>9</span><span>Active search space</span></div>
                        <div class="flex justify-between text-cyan-400"><span>2</span><span>5</span><span>9</span><span>Halved search space</span></div>
                        <div class="flex justify-between text-emerald-400"><span>3</span><span>5</span><span>6</span><span>Target element found</span></div>
                    </div>
                </div>
            `);
        }

        function triggerInterviewNotes() {
            const slide = slides[currentSlideIndex];
            openModal('FAANG Interview Master Notes', `
                <div class="space-y-3 text-xs">
                    <div class="glass-panel p-4 rounded-xl border border-slate-800 space-y-2">
                        <h5 class="font-bold text-amber-400">Pro Interview Tip</h5>
                        <p class="text-slate-300">${slide.tips}</p>
                    </div>
                    <div class="glass-panel p-4 rounded-xl border border-slate-800 space-y-2">
                        <h5 class="font-bold text-red-400">Common Candidate Pitfalls</h5>
                        <p class="text-slate-300">${slide.mistakes}</p>
                    </div>
                </div>
            `);
        }

        function openPlayground() {
            openModal('Java Code Playground', `
                <div class="space-y-3">
                    <textarea class="w-full h-48 bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-xs text-slate-200 focus:outline-none focus:border-blue-500">public class CustomSolution {
    public static void main(String[] args) {
        int[] scores = {95, 82, 88, 91, 79};
        System.out.println("Processing Java Array in Playground...");
    }
}</textarea>
                    <button onclick="runCodeSnippet()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition">Compile & Run Java</button>
                </div>
            `);
        }

        function openDashboard() {
            openModal('Learning Dashboard & XP', `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="glass-panel p-4 rounded-xl border border-slate-800 text-center">
                        <div class="text-2xl font-black text-blue-400">${userXP}</div>
                        <div class="text-[11px] text-slate-400 mt-1">Total XP Earned</div>
                    </div>
                    <div class="glass-panel p-4 rounded-xl border border-slate-800 text-center">
                        <div class="text-2xl font-black text-emerald-400">7 Days</div>
                        <div class="text-[11px] text-slate-400 mt-1">Daily Streak 🔥</div>
                    </div>
                    <div class="glass-panel p-4 rounded-xl border border-slate-800 text-center">
                        <div class="text-2xl font-black text-cyan-400">Senior Dev</div>
                        <div class="text-[11px] text-slate-400 mt-1">Masterclass Rank</div>
                    </div>
                </div>
            `);
        }

        function toggleInterviewMode() {
            isInterviewMode = !isInterviewMode;
            const btn = document.getElementById('interview-mode-btn');
            if (isInterviewMode) {
                btn.classList.add('bg-blue-600', 'text-white');
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.1 } });
            } else {
                btn.classList.remove('bg-blue-600', 'text-white');
            }
        }

        window.onload = function() {
            renderSidebar();
            renderSlide();
        };
    </script>
</body>
</html>
