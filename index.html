<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Learning Hub</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:90%;
            max-width:700px;
            text-align:center;
        }

        h1{
            font-size:45px;
            margin-bottom:15px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:40px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }

        .card{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            padding:30px;
            border-radius:15px;
            transition:.3s;
            border:1px solid rgba(255,255,255,0.15);
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 10px 30px rgba(0,255,255,.25);
        }

        .card h2{
            margin-bottom:15px;
        }

        .card p{
            margin-bottom:25px;
            color:#d1d5db;
        }

        a{
            text-decoration:none;
            color:white;
            background:#2563eb;
            padding:12px 25px;
            border-radius:8px;
            display:inline-block;
            transition:.3s;
        }

        a:hover{
            background:#1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>📘 DSA Learning Hub</h1>

    <p>Select a topic to start learning.</p>

    <div class="cards">

        <div class="card">
            <h2>📗 Array Notes</h2>
            <p>Complete Array algorithms with Java, explanations, and interview questions.</p>

            <a href="ArrayMasterclass.html">Open</a>
        </div>

        <div class="card">
            <h2>📘 Search Algorithms</h2>
            <p>Linear Search, Binary Search, Binary Search on Answer, and LeetCode problems.</p>

            <a href="searchalgorithem.html">Open</a>
        </div>

    </div>

</div>

</body>
</html>
